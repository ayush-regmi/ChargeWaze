# Render Blueprint for the ChargeWaze API (P6-F3). Setup steps: docs/deployment.md.
#
# Values marked `sync: false` are typed into the Render dashboard when the
# Blueprint is first created; none are committed. Deploys are not automatic:
# .github/workflows/deploy.yml runs migrations first, then asks Render to
# deploy the exact commit that passed CI.
services:
  - type: web
    # Keeps the pre-rename name on purpose (ADR 0011): Render matches Blueprint
    # services by name, and the URL chargewise-api.onrender.com never changes.
    name: chargewise-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      # ---- App ----
      - key: APP_ENV
        value: production
      # P6-F2: Supabase user IDs allowed in (comma-separated UUIDs). Under
      # APP_ENV=production an empty list locks EVERYONE out, the owner too.
      - key: LIVE_ALLOWED_USER_IDS
        sync: false
      # ADR 0012: the shared public demo account's Supabase user ID (optional;
      # read-only except planning; must not be in LIVE_ALLOWED_USER_IDS).
      - key: DEMO_USER_ID
        sync: false
      - key: ALLOWED_ORIGINS # the Vercel production URL, e.g. https://chargewaze.vercel.app
        sync: false
      # ---- Database (Supabase session pooler, postgresql+psycopg://...) ----
      - key: DATABASE_URL
        sync: false
      # ---- Supabase Auth ----
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      # P6-F5: account deletion and scripts/retention.py delete the Supabase
      # auth user through the admin API. Server-only; never in the web app.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      # ---- Smartcar V3 ----
      - key: SMARTCAR_CLIENT_ID
        sync: false
      - key: SMARTCAR_CLIENT_SECRET
        sync: false
      - key: SMARTCAR_APPLICATION_ID
        sync: false
      - key: SMARTCAR_REDIRECT_URI # https://<web>/garage/connect/callback
        sync: false
      - key: SMARTCAR_WEBHOOK_ID
        sync: false
      - key: SMARTCAR_MANAGEMENT_TOKEN
        sync: false
      - key: SMARTCAR_MODE
        value: live
      - key: SMARTCAR_STATE_SECRET
        generateValue: true
      # ---- Mapbox (server-side secret token) ----
      - key: MAPBOX_SECRET_TOKEN
        sync: false
      # ---- Charging stations ----
      - key: AFDC_API_KEY
        sync: false
      - key: STATIONS_CURSOR_SECRET
        generateValue: true
      # ---- Observability (P6-F1) ----
      - key: SENTRY_DSN_BACKEND
        sync: false
      # ---- Monitoring (P6-F4): guards GET /metrics; empty hides it ----
      - key: MONITORING_METRICS_TOKEN
        sync: false
