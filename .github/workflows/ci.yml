name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chargewise
          POSTGRES_PASSWORD: chargewise
          POSTGRES_DB: chargewise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chargewise -d chargewise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://chargewise:chargewise@localhost:5432/chargewise
      # pytest creates and resets this separate database (tests/conftest.py).
      TEST_DATABASE_URL: postgresql+psycopg://chargewise:chargewise@localhost:5432/chargewise_test

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest --maxfail=1

      - name: Alembic round-trip (upgrade, downgrade, upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Export OpenAPI
        run: |
          uv sync --project services/api --group dev
          uv run --project services/api python services/api/scripts/export_openapi.py

      - name: Generate API client schema
        run: npm run generate --workspace=packages/api-client

      - name: Lint / Typecheck / Test (Turborepo)
        run: npx turbo run lint typecheck test

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [web, backend]
    # Full credentialed E2E is a separate manual workflow. This smoke job only
    # proves the app shell renders and sign-out routing works.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Export OpenAPI and generate client
        run: |
          uv sync --project services/api --group dev
          uv run --project services/api python services/api/scripts/export_openapi.py
          npm run generate --workspace=packages/api-client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Playwright smoke
        run: npx playwright test
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
