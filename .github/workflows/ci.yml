name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chargewaze
          POSTGRES_PASSWORD: chargewaze
          POSTGRES_DB: chargewaze
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chargewaze -d chargewaze"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://chargewaze:chargewaze@localhost:5432/chargewaze
      # pytest creates and resets this separate database (tests/conftest.py).
      TEST_DATABASE_URL: postgresql+psycopg://chargewaze:chargewaze@localhost:5432/chargewaze_test

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest --maxfail=1

      - name: Alembic round-trip (upgrade, downgrade, upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  # P6-F3: the production API image (services/api/Dockerfile, deployed by
  # Render) must build, migrate a fresh database and answer /health.
  docker-build:
    name: API image (Docker)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chargewaze
          POSTGRES_PASSWORD: chargewaze
          POSTGRES_DB: chargewaze
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chargewaze -d chargewaze"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t chargewaze-api:ci services/api

      - name: Migrate and serve /health from the image
        run: |
          db="postgresql+psycopg://chargewaze:chargewaze@localhost:5432/chargewaze"
          docker run --rm --network host -e APP_ENV=production -e DATABASE_URL="$db" \
            chargewaze-api:ci alembic upgrade head
          docker run -d --name api --network host -e APP_ENV=production -e PORT=8000 \
            -e DATABASE_URL="$db" chargewaze-api:ci
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8000/health); then
              echo "$body"
              [ "$(echo "$body" | jq -r '.env')" = "production" ] && exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Export OpenAPI
        run: |
          uv sync --project services/api --group dev
          uv run --project services/api python services/api/scripts/export_openapi.py

      - name: Generate API client schema
        run: npm run generate --workspace=packages/api-client

      - name: Lint / Typecheck / Test (Turborepo)
        run: npx turbo run lint typecheck test

      # Phase 2 E6: no server-side secret may reach the browser bundle. Build
      # with sentinel values in the server-only env vars, then fail if any
      # sentinel or secret env-var name appears in the client output.
      - name: Build web with sentinel server secrets
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          SMARTCAR_CLIENT_SECRET: sentinel-server-secret-1
          SMARTCAR_MANAGEMENT_TOKEN: sentinel-server-secret-2
          SUPABASE_SERVICE_ROLE_KEY: sentinel-server-secret-3
          MAPBOX_SECRET_TOKEN: sentinel-server-secret-4

      - name: Check browser bundle for server secrets
        working-directory: apps/web
        run: |
          pattern="sentinel-server-secret|SMARTCAR_CLIENT_SECRET|SMARTCAR_MANAGEMENT_TOKEN|SMARTCAR_STATE_SECRET|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_JWT_SECRET|MAPBOX_SECRET_TOKEN|AFDC_API_KEY|WEATHER_API_KEY"
          # Everything sent to the browser: client JS/CSS, plus prerendered
          # HTML and RSC payloads (server-only JS bundles are not scanned).
          leaks=$(
            grep -rlE "$pattern" .next/static
            grep -rlE "$pattern" .next/server/app --include='*.html' --include='*.rsc' --include='*.body' --include='*.meta'
          ) || true
          if [ -n "$leaks" ]; then
            echo "$leaks"
            echo "::error::Server-side secret found in browser-served build output (files above)."
            exit 1
          fi
          echo "No server secrets in .next/static or prerendered pages."

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [web, backend]
    # Runs the API (on this job's Postgres) and the web app against a local
    # Supabase Auth stub; no real Supabase or Smartcar. Credentialed sign-in
    # flows are a separate manual workflow. See apps/web/playwright.config.ts.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chargewaze
          POSTGRES_PASSWORD: chargewaze
          POSTGRES_DB: chargewaze
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chargewaze -d chargewaze"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install workspaces
        run: npm ci

      - name: Export OpenAPI and generate client
        run: |
          uv sync --project services/api --group dev
          uv run --project services/api python services/api/scripts/export_openapi.py
          npm run generate --workspace=packages/api-client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Playwright E2E
        run: npx playwright test
        working-directory: apps/web
