name: Retention (production)

# P6-F5 / M-16. Runs services/api/scripts/retention.py against production once
# a day, as the privacy notice promises:
#   - deletes expired unsaved plans, old telemetry and old refresh-log rows;
#   - retries owed Smartcar revocations and Supabase auth-user deletions left
#     by DELETE /me, and removes finished account-deletion tombstones.
# The script exits 1 while deletion work is still owed, so a failed run is the
# alert (GitHub notifies on failed workflow runs). Manual runs default to
# --dry-run (count only, change nothing). Setup: docs/deployment.md §14.
# Until the `production` environment has every value below, the run ends with
# a notice instead of failing.

on:
  schedule:
    # Daily at 07:41 UTC (off the hour; scheduled runs can start late).
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: count what would be deleted, change nothing"
        type: boolean
        default: true

permissions:
  contents: read

# Never two passes at once, and never cancel one halfway (each step commits).
concurrency:
  group: retention-production
  cancel-in-progress: false

jobs:
  retention:
    name: Retention job
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Scheduled runs use the default branch; manual runs only from main.
    if: github.ref == 'refs/heads/main'
    env:
      # Scheduled runs have no inputs, so they always run for real.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - name: Check production secrets are configured
        id: preflight
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMARTCAR_CLIENT_ID: ${{ secrets.SMARTCAR_CLIENT_ID }}
          SMARTCAR_CLIENT_SECRET: ${{ secrets.SMARTCAR_CLIENT_SECRET }}
        run: |
          missing=""
          for name in PROD_DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SMARTCAR_CLIENT_ID SMARTCAR_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Production retention skipped; not configured in the 'production' environment:$missing (see docs/deployment.md §14)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.preflight.outputs.ready == 'true'

      - name: Install uv
        if: steps.preflight.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Sync API runtime dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: uv sync --project services/api --frozen --no-dev

      # Prints one line of counts (no IDs). Exit 1 means deletion work is
      # still owed: a Smartcar revocation or Supabase auth-user deletion keeps
      # failing. --dry-run only counts, and exits 0 even when work is owed.
      - name: Run retention
        if: steps.preflight.outputs.ready == 'true'
        working-directory: services/api
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMARTCAR_CLIENT_ID: ${{ secrets.SMARTCAR_CLIENT_ID }}
          SMARTCAR_CLIENT_SECRET: ${{ secrets.SMARTCAR_CLIENT_SECRET }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          set +e
          counts=$(uv run --frozen --no-dev python scripts/retention.py "${args[@]}")
          code=$?
          set -e
          echo "$counts"
          { echo '### Retention'; echo '```'; echo "$counts"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ] && [ -n "$counts" ]; then
            echo "::error::Deletion work is still owed (smartcar_pending or auth_users_pending above). See docs/deployment.md §14."
          fi
          exit "$code"
