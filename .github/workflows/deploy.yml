name: Deploy (production)

# P6-F3. Ships main to production in one fixed order, after CI passes:
#   1. alembic upgrade head against the production database
#   2. Render deploys the API image for the exact commit CI tested
#   3. /health answers from the new API
#   4. the web app is built here (the typed API client is generated, it is
#      not committed) and deployed to Vercel as a prebuilt production build
# Setup, secrets and rollback: docs/deployment.md. Until the `production`
# environment's secrets exist, the run ends with a notice instead of failing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time; never cancel one halfway (it may have
# migrated already). A newer run waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy API, deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check production secrets are configured
        id: preflight
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          missing=""
          for name in PROD_DATABASE_URL RENDER_API_KEY RENDER_SERVICE_ID VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID API_BASE_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Production deploy skipped; not configured in the 'production' environment:$missing (see docs/deployment.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.preflight.outputs.ready == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Install uv
        if: steps.preflight.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install Node
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Sync API runtime dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: uv sync --project services/api --frozen --no-dev

      # 1. Migrations run before the new code ships, so the new API never
      # starts against an old schema. Migrations must stay backward compatible
      # with the running API (docs/deployment.md "Migrations").
      - name: Migrate production database
        if: steps.preflight.outputs.ready == 'true'
        working-directory: services/api
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          uv run --frozen --no-dev alembic upgrade head
          uv run --frozen --no-dev alembic current

      # 2. Deploy the tested commit. Auto-deploy is off in render.yaml.
      - name: Deploy API on Render
        if: steps.preflight.outputs.ready == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          body=$(jq -n --arg sha "$DEPLOY_SHA" '{commitId: $sha, clearCache: "do_not_clear"}')
          deploy_id=$(curl -fsS -X POST "$api" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$body" | jq -r '.id')
          if [ -z "$deploy_id" ] || [ "$deploy_id" = "null" ]; then
            echo "::error::Render did not return a deploy id."
            exit 1
          fi
          echo "Render deploy $deploy_id for $DEPLOY_SHA"
          # Up to 25 minutes: free-plan Docker builds are slow.
          for _ in $(seq 1 100); do
            status=$(curl -fsS "$api/$deploy_id" -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
            echo "status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy $deploy_id ended as $status."
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Render deploy $deploy_id did not go live in time."
          exit 1

      # 3. The API must answer before the web app that calls it ships.
      - name: Check API health
        if: steps.preflight.outputs.ready == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          for _ in $(seq 1 20); do
            if body=$(curl -fsS --max-time 70 "${API_BASE_URL%/}/health"); then
              echo "$body"
              if [ "$(echo "$body" | jq -r '.env')" = "production" ]; then exit 0; fi
              echo "::error::/health answered but env is not production."
              exit 1
            fi
            sleep 10
          done
          echo "::error::${API_BASE_URL%/}/health did not answer."
          exit 1

      # 4. Web app. Vercel's Git integration is off (apps/web/vercel.json)
      # because the build needs the generated API client.
      - name: Install workspaces
        if: steps.preflight.outputs.ready == 'true'
        run: npm ci

      - name: Generate API client
        if: steps.preflight.outputs.ready == 'true'
        run: |
          uv run --project services/api --frozen --no-dev python services/api/scripts/export_openapi.py
          npm run generate --workspace=packages/api-client

      - name: Build web app (Vercel, production)
        if: steps.preflight.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@65.11.0 pull --yes --environment=production
          npx --yes vercel@65.11.0 build --prod

      # Same rule as CI's sentinel check, on the real production build.
      - name: Check browser bundle for server secrets
        if: steps.preflight.outputs.ready == 'true'
        run: |
          pattern="SMARTCAR_CLIENT_SECRET|SMARTCAR_MANAGEMENT_TOKEN|SMARTCAR_STATE_SECRET|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_JWT_SECRET|MAPBOX_SECRET_TOKEN|AFDC_API_KEY|WEATHER_API_KEY|SENTRY_AUTH_TOKEN"
          leaks=$(grep -rlE "$pattern" .vercel/output/static) || true
          if [ -n "$leaks" ]; then
            echo "$leaks"
            echo "::error::Server-side secret name found in the browser-served build output."
            exit 1
          fi
          echo "No server secret names in .vercel/output/static."

      - name: Deploy web app to Vercel
        if: steps.preflight.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(npx --yes vercel@65.11.0 deploy --prebuilt --prod)
          echo "Deployed: $url"
          echo "Web deployment: $url" >> "$GITHUB_STEP_SUMMARY"
