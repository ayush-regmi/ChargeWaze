[project]
name = "chargewaze-api"
version = "0.0.0"
description = "ChargeWaze FastAPI backend (modular monolith)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "UNLICENSED" }
authors = [{ name = "ChargeWaze" }]

# Real dependencies (FastAPI, Pydantic, SQLAlchemy, Alembic, Supabase client, etc.)
# are added in Phase 1 via `uv add <package>`. See docs/development-roadmap.md.
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "sentry-sdk[fastapi]>=2.75.0",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "sqlalchemy[mypy]>=2.1.8",
    "types-psycopg2>=2.9.21.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008 fires on FastAPI's `Depends(...)` default pattern, which is idiomatic.
# A001/A002 collide with SQLAlchemy keyword args like `type_` and `object`.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["A002"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # Starlette emits this during TestClient teardown on current versions.
    "ignore::DeprecationWarning:starlette",
    "ignore::DeprecationWarning:httpx",
]

[tool.uv]
# Dev dependencies get added later with `uv add --group dev <package>`.
package = true
