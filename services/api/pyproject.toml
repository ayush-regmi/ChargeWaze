[project]
name = "chargewise-api"
version = "0.0.0"
description = "Chargewise FastAPI backend (modular monolith)."
requires-python = ">=3.12"
readme = "../../README.md"
license = { text = "UNLICENSED" }
authors = [{ name = "Chargewise" }]

# Real dependencies (FastAPI, Pydantic, SQLAlchemy, Alembic, Supabase client, etc.)
# are added in Phase 1 via `uv add <package>`. See docs/development-roadmap.md.
dependencies = []

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.uv]
# Dev dependencies get added later with `uv add --group dev <package>`.
package = true
