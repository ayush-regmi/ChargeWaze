# Local development Postgres used ONLY for running Alembic migrations and
# the backend test suite against a Postgres-flavored engine. Real ChargeWaze
# development uses hosted Supabase (ADR 0001, ADR 0006).
#
# Usage:
#   docker compose up -d
#   DATABASE_URL="postgresql+psycopg://chargewaze:chargewaze@localhost:5432/chargewaze" \
#     uv run --project services/api alembic upgrade head

services:
  postgres:
    image: postgres:16-alpine
    container_name: chargewaze-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chargewaze
      POSTGRES_PASSWORD: chargewaze
      POSTGRES_DB: chargewaze
    ports:
      - "5432:5432"
    volumes:
      - chargewaze-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargewaze -d chargewaze"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chargewaze-postgres-data:
